name: Feature request
description: Propose a focused improvement to the local evidence workflow.
title: "feature: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What evidence or replay task is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: Privacy and provider boundary
      description: Explain what local data is required and whether the provider actually exposes it.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
