name: CI

on:
  # Temporarily manual-only. Restore `push` and `pull_request` triggers here
  # when automatic CI should run again.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node 24 verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify format, lint, types, tests, and production build
        run: npm run verify
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser end-to-end tests
        run: npm run test:e2e
